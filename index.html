<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#013F4A">
  <title>Americano Coffee</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--dark:#013F4A;--green:#068562;--green2:#0aa576;--white:#fff;--muted:rgba(255,255,255,.72);--line:rgba(255,255,255,.16);--shadow:0 18px 42px rgba(0,0,0,.28)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:linear-gradient(160deg,var(--dark),#022f38 48%,var(--green));color:var(--white)}
    body{padding-bottom:92px}.page{max-width:580px;margin:auto}.header{padding:26px 18px 22px;text-align:center;background:linear-gradient(145deg,var(--green),var(--dark));border-bottom:1px solid var(--line);box-shadow:var(--shadow);position:sticky;top:0;z-index:5}.logo{width:72px;height:72px;border-radius:24px;margin:auto;display:grid;place-items:center;font-size:38px;background:rgba(255,255,255,.1);border:1px solid var(--line)}h1{margin:12px 0 4px;font-size:30px;letter-spacing:2px}.sub{color:var(--muted);font-weight:700}.notice{margin:14px;padding:14px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.08);box-shadow:var(--shadow);line-height:1.45}.langs,.cats,.choice{display:flex;gap:10px;overflow:auto;padding:12px 14px}.btn,.pill,select,input,textarea{border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.09);color:#fff;font-weight:800}.btn,.pill{padding:11px 15px;white-space:nowrap;cursor:pointer}.active{background:var(--green2)!important}.branch{margin:0 14px 12px}.branch label{display:block;margin:0 0 8px;font-weight:900}.branch select{width:100%;padding:14px;background:var(--dark)}option{color:#111}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:0 14px}.card{background:linear-gradient(180deg,rgba(6,133,98,.98),rgba(1,63,74,.98));border:1px solid var(--line);border-radius:24px;padding:14px;text-align:center;box-shadow:var(--shadow)}.icon{font-size:46px}.name{font-weight:900;min-height:42px;display:grid;place-items:center}.meta{font-size:12px;color:var(--muted)}.price{font-size:17px;font-weight:900;margin:9px 0}.counter{display:flex;align-items:center;justify-content:center;gap:12px}.counter button{width:34px;height:34px;border:0;border-radius:50%;background:#fff;color:var(--dark);font-size:20px;font-weight:900}.cart{margin:16px 14px;padding:16px;border-radius:24px;background:rgba(0,0,0,.18);border:1px solid var(--line);box-shadow:var(--shadow)}.line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.1)}.field{width:100%;padding:14px;margin-top:10px}.choice{padding:10px 0}.choice .btn{flex:1;text-align:center}.send{width:100%;padding:17px;margin-top:14px;border:0;border-radius:20px;background:linear-gradient(180deg,var(--green2),var(--green));color:#fff;font-size:17px;font-weight:900;box-shadow:var(--shadow)}.sticky{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;background:rgba(1,63,74,.9);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:8}.stickyin{max-width:552px;margin:auto;display:flex;justify-content:space-between;align-items:center;border-radius:18px;background:#fff;color:var(--dark);padding:12px 14px;font-weight:900}.sticky button{border:0;border-radius:14px;background:var(--green);color:#fff;padding:11px 14px;font-weight:900}@media(max-width:370px){.products{gap:10px;padding:0 10px}.card{padding:11px}.name{font-size:14px}}
  </style>
</head>
<body>
<div class="page">
  <header class="header"><div class="logo">☕</div><h1>AMERICANO</h1><div class="sub">Coffee • Loyalty • 3 филиала</div></header>
  <div class="notice" id="note">Каждый шестой кофе бесплатно. Бот сам считает покупки во всех трёх филиалах — кассиру ничего подтверждать не нужно.</div>
  <div class="langs"><button class="pill active" data-lang="ru">🇷🇺 RU</button><button class="pill" data-lang="uz">🇺🇿 UZ</button><button class="pill" data-lang="en">🇬🇧 EN</button></div>
  <div class="branch"><label id="branchLabel">Выберите филиал</label><select id="branch"><option value="">—</option><option value="branch_1">Americano — Филиал 1</option><option value="branch_2">Americano — Филиал 2</option><option value="branch_3">Americano — Филиал 3</option></select></div>
  <div class="cats" id="cats"></div><div class="products" id="products"></div>
  <section class="cart" id="cartBox"><h2 id="cartTitle">Корзина</h2><div id="cartLines"></div><div class="line"><b id="totalLabel">Итого</b><b><span id="total">0</span> сум</b></div>
    <div class="choice"><button class="btn active" id="pickup">Самовывоз</button><button class="btn" id="delivery">Доставка</button></div>
    <input class="field" id="phone" placeholder="Номер телефона" inputmode="tel"><input class="field" id="address" placeholder="Адрес доставки" style="display:none"><textarea class="field" id="comment" placeholder="Комментарий"></textarea>
    <div class="choice"><button class="btn active pay" data-pay="cash">Наличные</button><button class="btn pay" data-pay="click">Click</button><button class="btn pay" data-pay="card">Карта</button></div>
    <button class="send" id="send">Оформить заказ</button>
  </section>
</div>
<div class="sticky"><div class="stickyin"><span><span id="stickyTotal">0</span> сум</span><button onclick="document.getElementById('cartBox').scrollIntoView({behavior:'smooth'})">Корзина</button></div></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const PRODUCTS=[
{id:'espresso',cat:'coffee',icon:'☕',meta:'30 мл',price:18000,is_coffee:true,n:{ru:'Эспрессо',uz:'Espresso',en:'Espresso'}},
{id:'americano',cat:'coffee',icon:'☕',meta:'250 мл',price:22000,is_coffee:true,n:{ru:'Американо',uz:'Amerikano',en:'Americano'}},
{id:'cappuccino',cat:'coffee',icon:'☕',meta:'300 мл',price:28000,is_coffee:true,n:{ru:'Капучино',uz:'Kapuchino',en:'Cappuccino'}},
{id:'latte',cat:'coffee',icon:'🥛',meta:'350 мл',price:30000,is_coffee:true,n:{ru:'Латте',uz:'Latte',en:'Latte'}},
{id:'flat_white',cat:'coffee',icon:'☕',meta:'250 мл',price:32000,is_coffee:true,n:{ru:'Флэт уайт',uz:'Flat white',en:'Flat white'}},
{id:'raf',cat:'coffee',icon:'🫘',meta:'350 мл',price:34000,is_coffee:true,n:{ru:'Раф',uz:'Raf',en:'Raf coffee'}},
{id:'iced_americano',cat:'coffee',icon:'🧊',meta:'400 мл',price:28000,is_coffee:true,n:{ru:'Айс американо',uz:'Ays amerikano',en:'Iced Americano'}},
{id:'iced_latte',cat:'coffee',icon:'🧊',meta:'400 мл',price:34000,is_coffee:true,n:{ru:'Айс латте',uz:'Ays latte',en:'Iced Latte'}},
{id:'berry_tea',cat:'tea',icon:'🫖',meta:'500 мл',price:26000,is_coffee:false,n:{ru:'Ягодный чай',uz:'Rezavorli choy',en:'Berry tea'}},
{id:'green_tea',cat:'tea',icon:'🍵',meta:'500 мл',price:22000,is_coffee:false,n:{ru:'Зелёный чай',uz:"Ko‘k choy",en:'Green tea'}},
{id:'mojito',cat:'cold',icon:'🍋',meta:'450 мл',price:30000,is_coffee:false,n:{ru:'Мохито',uz:'Moxito',en:'Mojito'}},
{id:'berry_mix',cat:'cold',icon:'🫐',meta:'450 мл',price:32000,is_coffee:false,n:{ru:'Ягодный микс',uz:'Rezavorli miks',en:'Berry mix'}},
{id:'croissant',cat:'food',icon:'🥐',meta:'1 шт',price:20000,is_coffee:false,n:{ru:'Круассан',uz:'Kruassan',en:'Croissant'}},
{id:'cheesecake',cat:'food',icon:'🍰',meta:'1 порция',price:35000,is_coffee:false,n:{ru:'Чизкейк',uz:'Chizkeyk',en:'Cheesecake'}}];
const T={ru:{cats:{all:'Все',coffee:'Кофе',tea:'Чай',cold:'Холодные',food:'Десерты'},cart:'Корзина',total:'Итого',branch:'Выберите филиал',empty:'Корзина пустая',phone:'Введите номер телефона',addr:'Введите адрес доставки',branchReq:'Выберите один из трёх филиалов'},uz:{cats:{all:'Barchasi',coffee:'Qahva',tea:'Choy',cold:'Sovuq',food:'Desertlar'},cart:'Savat',total:'Jami',branch:'Filialni tanlang',empty:'Savat bo‘sh',phone:'Telefon raqamini kiriting',addr:'Manzilni kiriting',branchReq:'Uchta filialdan birini tanlang'},en:{cats:{all:'All',coffee:'Coffee',tea:'Tea',cold:'Cold',food:'Desserts'},cart:'Cart',total:'Total',branch:'Choose a branch',empty:'Cart is empty',phone:'Enter phone number',addr:'Enter delivery address',branchReq:'Choose one of the three branches'}};
let lang='ru',cat='all',fulfillment='pickup',payment='cash';const cart={};const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString('ru-RU');
function renderCats(){$('cats').innerHTML=Object.entries(T[lang].cats).map(([k,v])=>`<button class="pill ${cat===k?'active':''}" onclick="setCat('${k}')">${v}</button>`).join('')}
function renderProducts(){const list=PRODUCTS.filter(x=>cat==='all'||x.cat===cat);$('products').innerHTML=list.map(x=>`<article class="card"><div class="icon">${x.icon}</div><div class="name">${x.n[lang]}</div><div class="meta">${x.meta}</div><div class="price">${fmt(x.price)} сум</div><div class="counter"><button onclick="change('${x.id}',-1)">−</button><b>${cart[x.id]||0}</b><button onclick="change('${x.id}',1)">+</button></div></article>`).join('')}
function renderCart(){const rows=PRODUCTS.filter(x=>cart[x.id]>0),sum=rows.reduce((s,x)=>s+x.price*cart[x.id],0);$('cartLines').innerHTML=rows.length?rows.map(x=>`<div class="line"><span>${x.n[lang]} × ${cart[x.id]}</span><b>${fmt(x.price*cart[x.id])} сум</b></div>`).join(''):`<div style="color:var(--muted);padding:10px 0">${T[lang].empty}</div>`;$('total').textContent=$('stickyTotal').textContent=fmt(sum)}
function setCat(v){cat=v;renderCats();renderProducts()}function change(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);renderProducts();renderCart()}
function applyLang(){$('cartTitle').textContent=T[lang].cart;$('totalLabel').textContent=T[lang].total;$('branchLabel').textContent=T[lang].branch;renderCats();renderProducts();renderCart()}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-lang]').forEach(x=>x.classList.remove('active'));b.classList.add('active');lang=b.dataset.lang;applyLang()});
$('pickup').onclick=()=>{fulfillment='pickup';$('pickup').classList.add('active');$('delivery').classList.remove('active');$('address').style.display='none'};$('delivery').onclick=()=>{fulfillment='delivery';$('delivery').classList.add('active');$('pickup').classList.remove('active');$('address').style.display='block'};
document.querySelectorAll('.pay').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pay').forEach(x=>x.classList.remove('active'));b.classList.add('active');payment=b.dataset.pay});
$('send').onclick=()=>{const selected=PRODUCTS.filter(x=>cart[x.id]>0);if(!selected.length)return alert(T[lang].empty);const branch=$('branch');if(!branch.value)return alert(T[lang].branchReq);const phone=$('phone').value.trim();if(!phone)return alert(T[lang].phone);if(fulfillment==='delivery'&&!$('address').value.trim())return alert(T[lang].addr);const items=selected.map(x=>({id:x.id,qty:cart[x.id],price:x.price,name_ru:x.n.ru,name_lang:x.n[lang],category:x.cat,is_coffee:x.is_coffee,meta:x.meta}));const total=selected.reduce((s,x)=>s+x.price*cart[x.id],0);const payload={action:'order',brand:'Americano',branch_id:branch.value,branch_name:branch.options[branch.selectedIndex].text,order_id:'AM-'+Date.now(),items,total_num:total,total:fmt(total),phone,fulfillment,address:fulfillment==='delivery'?$('address').value.trim():'',payment_method:payment,payment_label:payment==='cash'?'Наличные':payment==='click'?'Click':'Карта',comment:$('comment').value.trim(),lang};tg?.sendData(JSON.stringify(payload));setTimeout(()=>tg?.close(),300)};
applyLang();try{tg?.setHeaderColor('#013F4A');tg?.setBackgroundColor('#013F4A')}catch(e){}
</script>
</body>
</html>
